logging.level.org.springframework=WARN
logging.level.com.myoffice.payroll_system=INFO
logging.level.org.springframework.security=WARN

spring.main.banner-mode=off
spring.devtools.restart.enabled=false
jwt.secret=test-secret-key-for-security-tests-123456

spring.datasource.url=jdbc:h2:mem:payroll_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
